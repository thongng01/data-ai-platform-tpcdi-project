# Configure the optional Spark cluster, HiveServer2 endpoint, and submit runner.
#
# Run from infra/ with `docker compose --profile compute up -d`. The compute
# profile starts the master and worker; spark-jobs runs submitted applications.
# Add --profile dbt alongside --profile compute to start HiveServer2 for Thrift
# clients. The dbt profile alone excludes its required spark-master service.
#
# Master and worker start scripts run daemons in the foreground when
# SPARK_NO_DAEMONIZE is set. Application submission reads spark-defaults.conf;
# daemon resource limits come from command arguments and daemon settings.
#
# Long-lived applications can hold worker cores and leave new jobs waiting.
# spark.executor.cores limits each executor, not the whole application. Use
# spark.cores.max when an application must leave capacity for another one.

services:

  spark-master:
    image: ${SPARK_IMAGE}
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    profiles: ["compute"]
    restart: unless-stopped
    networks: [platform]
    command:
      - /opt/spark/sbin/start-master.sh
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_NO_DAEMONIZE: "1"
    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_UI_PORT}:8080"
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      - hive-metastore
    healthcheck:
      # Bash opens a TCP connection without curl. This proves the port accepts
      # connections, not that a Spark application can obtain worker resources.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7077"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  spark-worker:
    image: ${SPARK_IMAGE}
    profiles: ["compute"]
    restart: unless-stopped
    networks: [platform]
    command:
      - /opt/spark/sbin/start-slave.sh
      - spark://spark-master:7077
      - --cores
      - "6"
      - --memory
      - 5g
      - --webui-port
      - "8081"
    environment:
      SPARK_NO_DAEMONIZE: "1"
      SPARK_WORKER_DIR: /tmp/spark-worker
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # Job code is mounted, not copied into the image, so editing a job needs
      # no rebuild and no container restart.
      - ../data/spark:/opt/pipelines:ro
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    depends_on:
      # The worker registers with the master after its process starts.
      - spark-master
    deploy:
      resources:
        limits:
          memory: 5G
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  spark-thrift:
    image: ${SPARK_IMAGE}
    profiles: ["dbt"]
    restart: unless-stopped
    networks: [platform]
    command:
      - /opt/spark/sbin/start-thriftserver.sh
      - --conf
      - spark.executor.memory=640m
      - --conf
      - spark.executor.cores=1
      - --hiveconf
      - hive.server2.thrift.port=10001
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0
    environment:
      SPARK_NO_DAEMONIZE: "1"
      # This is a timeout request in seconds, not a connection or core limit.
      # It takes effect only if the image maps this environment key to Hive config.
      HIVE_SERVER2_THRIFT_HSERVER_OPERATION_TIMEOUT: "3600"
    ports:
      - "${SPARK_THRIFT_PORT}:10001"
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../data/spark:/opt/pipelines:ro
    depends_on:
      # This controls process order, not application readiness or free cores.
      - spark-master
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  # Submit with `docker compose --profile compute run --rm spark-jobs <args>`.
  # Start the cluster first. This runner has no depends_on, so invoking it does
  # not start the cluster or prove that worker resources are available.
  spark-jobs:
    image: ${SPARK_IMAGE}
    profiles: ["compute"]
    networks: [platform]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    environment:
      SPARK_NO_DAEMONIZE: "1"
      # Python S3 clients read these environment values. They do not read the
      # Hadoop settings in spark-defaults.conf, which serve the S3A client.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../data/spark:/opt/pipelines:ro
      - ../data/dbt:/opt/dbt:ro
      # Read-write scratch and run reports stay outside tracked source files.
      - ../local:/opt/local
