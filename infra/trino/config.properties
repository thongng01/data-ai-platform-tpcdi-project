# Configure one Trino process as both coordinator and query worker.
# Query memory limits must fit inside the JVM heap after the reserved headroom;
# the container also needs memory for the JVM outside that heap.

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Total query memory is capped across workers; per-node memory is capped here
# too. On this single-node deployment, the lower per-node cap can limit a query.
query.max-memory=768MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=384MB

# Splits are units of scheduled connector work. These ceilings limit queued
# splits; they do not set a fixed file count or reserve a thread per file.
node-scheduler.max-splits-per-node=200
node-scheduler.max-unacknowledged-splits-per-task=1000

# Connector properties belong in trino/catalog/*.properties. Unknown server
# keys can prevent startup, so validate this file against the selected image.
