# Trino server configuration.
#
# The platform shares 15 GB of RAM across about a dozen containers, so the
# coordinator and worker run in one JVM with a small heap.

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

query.max-memory=768MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=384MB

# Bronze and silver hold many small Parquet files before compaction runs, and a
# single query can touch one file per task slot.
node-scheduler.max-splits-per-node=200
node-scheduler.max-unacknowledged-splits-per-task=1000

# Connector properties live in trino/catalog/*.properties, not here. Trino
# refuses to start if a config.properties key it does not recognise appears,
# and any hive.* key is rejected for exactly that reason.