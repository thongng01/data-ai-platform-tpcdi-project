# Trino catalog: the gold warehouse tables that live in Postgres.
#
# Gold is the queryable layer for BI and for validation checks. Trino federates
# it with the lakehouse catalog, so one SQL statement can join a Postgres fact
# table to a SeaweedFS Parquet table.

connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/warehouse
connection-user=edai
connection-password=edai_local_dev