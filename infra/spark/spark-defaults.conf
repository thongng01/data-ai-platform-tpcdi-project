# Spark defaults for the coursework lakehouse.
#
# This file is the whole of the Spark-to-SeaweedFS wiring. It is mounted into
# the master, the worker, the Thrift server and the one-shot submit container,
# so every process reads the same values. Nothing about the object store is set
# per job.

# ---------------------------------------------------------------- the cluster --
# One master URL for everything: spark-submit, the Thrift server, and the
# worker. HiveThriftServer2 has no --master flag; it reads spark.master from
# here, so the address has to be in this file.
spark.master spark://spark-master:7077

# ---------------------------------------------------------------- metastore --
# Without this, Spark's catalog is an in-memory map and forgets every table the
# moment a session ends. Trino would then read a metastore that has no record of
# the tables Spark wrote.
spark.sql.catalogImplementation  hive
spark.hadoop.hive.metastore.uris thrift://hive-metastore:9083

# Spark 3.5 bundles a Hive 2.3 client. It talks to the 3.1 metastore, but only
# when the client jars are the built-in ones; `maven` would fetch a different
# set on every job.
spark.sql.hive.metastore.jars builtin

# ------------------------------------------------------------- object store --
spark.sql.warehouse.dir s3a://lakehouse/warehouse
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint http://seaweedfs:8333
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.access.key edaiaccess
spark.hadoop.fs.s3a.secret.key edaisecret123
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# SeaweedFS does not implement the aws-chunked streaming encoding, so the SDK
# must fall back to plain signed payloads.
spark.hadoop.fs.s3a.aws.chunkedEncoding false

# Retry rather than fail the job when the gateway is briefly busy. Ingest
# retries are cheap; a failed batch run is not.
spark.hadoop.fs.s3a.retry.limit 7
spark.hadoop.fs.s3a.retry.interval 1000
spark.hadoop.fs.s3a.connection.maximum 200
spark.hadoop.fs.s3a.threads.max 64

# ----------------------------------------------------------------- dynamic --
# Every batch writes a dt=YYYY-MM-DD partition. Static overwrite deletes
# partitions that match the spec even when they received no rows, which
# silently deletes a day when a re-run finds nothing to write.
spark.sql.sources.partitionOverwriteMode dynamic
spark.sql.hive.exec.dynamic.partition true
spark.sql.hive.exec.dynamic.partition.mode nonstrict

# ------------------------------------------------------------------ sizing --
# One worker, six cores and 5 GB, shared by whatever is running.
#
#   DP1 and DP3 jobs   2 x (1 core, 1 GB)
#   HiveServer2 (DP2)  asks the master for the whole worker, which is why it
#                      lives in its own compose profile rather than here
#
# A job that cannot get an executor does not fail. It waits, and the log shows
# "Initial job has not accepted any resources" every 15 seconds and never a
# stack trace. Check misc/tools/spark_master_state.sh before debugging the job.
spark.driver.memory 1g
spark.driver.maxResultSize 512m
spark.executor.memory 1g
spark.executor.cores 2
spark.executor.instances 1
spark.memory.fraction 0.5
spark.memory.storageFraction 0.3

# A job that cannot get resources in two minutes fails loudly instead of
# hanging forever on a cluster that is too small.
spark.excludeOnFailure.enabled true
spark.excludeOnFailure.timeout 120s

# Skew handling: a join key where one value dominates produces a single task
# holding most of the rows. Adaptive execution splits that task at run time
# instead of asking us to guess an AQE skew join partition factor.
spark.sql.adaptive.enabled true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled true
spark.sql.adaptive.skewJoin.skewedPartitionFactor 3
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes 256m
spark.sql.adaptive.advisoryPartitionSizeInBytes 128m

# Small files are the storage problem this project has to fix. Parquet v2 with
# dictionary encoding is a fraction of the v1 size on our text columns.
spark.sql.parquet.compression.codec zstd
spark.sql.parquet.enable.dictionary true
spark.sql.sources.partitionOverwriteMode dynamic

spark.serializer org.apache.spark.serializer.KryoSerializer
spark.sql.session.timeZone UTC

# Event log: the Spark UI reads this, and it is the evidence the rubric asks for
# when it wants a screenshot of a skewed stage.
spark.eventLog.enabled true
spark.eventLog.dir s3a://lakehouse/spark-logs
spark.eventLog.rolling true
spark.eventLog.maxFileSize 64m
spark.ui.showConsoleProgress false
spark.ui.enabled true
spark.ui.retainedJobs 200
spark.ui.retainedStages 400