# Configure core storage, catalog, query, and database services and admin runners.
#
# PostgreSQL, SeaweedFS, Hive Metastore, and Trino have no profile. Compose starts
# them by default; profiles enable optional services and one-shot runners.
#
# Services behind profiles live in the sibling files:
#   compose.compute.yaml       spark cluster + spark jobs
#   compose.streaming.yaml     kafka + flink
#   compose.orchestration.yaml airflow
#   compose.governance.yaml    datahub + opensearch
#
# Run from infra/: `docker compose up -d`. See docs/IaC.md for private config setup.

name: ${COMPOSE_PROJECT_NAME}

x-common: &common
  restart: unless-stopped
  # Compose adds project scope to the actual network name.
  networks: [platform]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ------------------------------------------------------------ warehouse ---
  # One Postgres instance, four logical databases. The metastore database is
  # separate from the warehouse database on purpose: a business table must never
  # sit next to Hive catalog tables.
  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE}
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_METASTORE}
      # Checksums detect damaged data pages. This applies only at initialization.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=300
      # Shared buffers allocate server memory. Effective cache size is only a
      # planner estimate of database buffers plus the operating system cache.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      # work_mem applies to each sort or hash operation, not each connection.
      # Concurrent queries can therefore exceed the container memory limit.
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=128MB
      # More statistics samples can improve estimates at a higher ANALYZE cost.
      - -c
      - default_statistics_target=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_METASTORE}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1536M

  # ------------------------------------------------------------ lakehouse ---
  # `weed server` runs master, volume, filer, and S3 gateway roles together.
  # They share the data volume and the container memory limit.
  seaweedfs:
    <<: *common
    image: ${SEAWEEDFS_IMAGE}
    ports:
      - "${SEAWEEDFS_S3_PORT}:8333"        # S3 API, what Spark/HMS/Trino talk to
      - "${SEAWEEDFS_MASTER_PORT}:9333"    # master UI
      - "${SEAWEEDFS_VOLUME_PORT}:8080"    # volume UI
      - "${SEAWEEDFS_FILER_PORT}:8888"     # filer UI
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -master.port=9333
      - -master.telemetry=false
      - -volume.port=8080
      # Zero derives the volume-count limit from free disk space and the volume
      # size limit. Each bucket needs volumes in its own collection, so free
      # bytes alone do not guarantee a writable slot. Allocation failures can
      # surface as S3 retries. See docs/IaC.md for small-bucket sizing.
      - -volume.max=0
      - -volume.minFreeSpacePercent=5
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      # Load identities from a private JSON file. That file contains literal
      # values; Compose does not substitute variables inside it.
      - -s3.config=/etc/seaweedfs/s3.json
      # Clients use path-style URLs: the bucket is in the path, not a DNS name.
      - -s3.domainName=seaweedfs:8333
      - -s3.autoCreateBucket=true
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1536M

  # -------------------------------------------------------- hive metastore --
  # Catalog for the lakehouse. Spark writes Parquet and records table and
  # partition metadata here; Trino reads the same metadata back to find files.
  hive-metastore:
    <<: *common
    image: ${HIVE_METASTORE_IMAGE}
    ports:
      - "${HIVE_METASTORE_PORT}:9083"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      SERVICE: metastore
      # This image checks that all storage variable names exist, including the
      # unused Azure and Google variables. Empty strings satisfy the presence
      # check without enabling those storage backends.
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_METASTORE}
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_USER: ${POSTGRES_USER}
      HIVE_METASTORE_PASSWORD: ${POSTGRES_PASSWORD}
      HIVE_METASTORE_WAREHOUSE_DIR: s3a://${LAKEHOUSE_BUCKET}/warehouse
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: us-east-1
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Xms256m -Xmx768m
        -Dmetastore.schema.verification=false
        -Dmetastore.expression.proxy=org.apache.hadoop.hive.metastore.DefaultPartitionExpressionProxy
    deploy:
      resources:
        limits:
          memory: 1280M

  # ------------------------------------------------------------------ trino --
  # Query engine over the lakehouse and warehouse. Batch pipelines do not use
  # Trino as their writer; clients use its internal port 8080.
  trino:
    <<: *common
    image: ${TRINO_IMAGE}
    ports:
      - "${TRINO_PORT}:8080"
    depends_on:
      hive-metastore:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2560M

  # ------------------------------------------------------------- bootstrap --
  # Create configured buckets and databases, then exit. Run from infra/ with
  # `docker compose --profile init run --rm bootstrap` after core services start.
  bootstrap:
    image: ${BOOTSTRAP_IMAGE}
    build:
      context: .
      dockerfile: docker/bootstrap/Dockerfile
    profiles: ["init"]
    networks: [platform]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      hive-metastore:
        condition: service_started
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      LANDING_BUCKET: ${LANDING_BUCKET}
      DB_WAREHOUSE: ${POSTGRES_DB_WAREHOUSE}
      DB_METASTORE: ${POSTGRES_DB_METASTORE}
      DB_AIRFLOW: ${POSTGRES_DB_AIRFLOW}
      DB_DATAHUB: ${POSTGRES_DB_DATAHUB}
    command: ["python", "-m", "bootstrap.run"]

  # ---------------------------------------------------------------- tools ---
  # One-shot. Smoke tests and admin scripts, run against whatever is up.
  #   docker compose --profile tools run --rm tools
  tools:
    image: ${TOOLS_IMAGE}
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    profiles: ["tools"]
    networks: [platform]
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      TRINO_HOST: trino
      TRINO_PORT: 8080
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_WAREHOUSE: ${POSTGRES_DB_WAREHOUSE}
    volumes:
      # SQL files avoid nested shell quoting. The read-only workflow mount lets
      # sql_file.py read a query without giving the runner write access.
      - ../workflow:/opt/workflow:ro

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  seaweedfs-data:
