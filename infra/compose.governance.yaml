# Configure DataHub, its search backend, and an ingestion runner.
#
# Run from infra/ with the governance and stream profiles when DataHub needs
# Kafka. The governance profile alone does not select the Kafka service.
# PostgreSQL holds catalog state; OpenSearch holds searchable indexes.
# Container memory limits add together, so budget this group with the other
# enabled profiles. See docs/IaC.md for limits, not measured memory use.

services:

  opensearch:
    image: ${OPENSEARCH_IMAGE}
    profiles: ["governance"]
    restart: unless-stopped
    networks: [platform]
    environment:
      discovery.type: single-node
      # DataHub connects without TLS or authentication. Do not expose this
      # search endpoint outside the private development network.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Locking memory avoids swapping the JVM heap. memlock below permits it;
      # the container limit must also leave room for non-heap memory.
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx1024m"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M

  datahub-upgrade:
    image: ${DATAHUB_UPGRADE_IMAGE}
    profiles: ["governance"]
    networks: [platform]
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATAHUB_DB_HOST: postgres
      DATAHUB_DB_PORT: "5432"
      DATAHUB_DB_NAME: ${POSTGRES_DB_DATAHUB}
      DATAHUB_DB_USERNAME: ${POSTGRES_USER}
      DATAHUB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATAHUB_DB_TYPE: postgres
      EBEAN_DATASOURCE_USERNAME: ${POSTGRES_USER}
      EBEAN_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DATAHUB_SERVER_TYPE: quickstart
      KAFKA_BOOTSTRAP_SERVER: PLAINTEXT://kafka:29092
    # Apply DataHub database upgrades before GMS starts. This changes persistent
    # application state, unlike rendering the Compose configuration.
    command: ["DOB upgrade"]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G

  datahub-gms:
    image: ${DATAHUB_GMS_IMAGE}
    profiles: ["governance"]
    restart: unless-stopped
    networks: [platform]
    ports:
      - "${DATAHUB_GMS_PORT}:8080"
    depends_on:
      datahub-upgrade:
        condition: service_completed_successfully
    environment:
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_DB_HOST: postgres
      DATAHUB_DB_PORT: "5432"
      DATAHUB_DB_NAME: ${POSTGRES_DB_DATAHUB}
      DATAHUB_DB_USERNAME: ${POSTGRES_USER}
      DATAHUB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EBEAN_DATASOURCE_USERNAME: ${POSTGRES_USER}
      EBEAN_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVER: PLAINTEXT://kafka:29092
      MAE_CONSUMER_HOST: datahub-gms
      MCE_CONSUMER_HOST: datahub-gms
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_USE_SSL: "false"
      DATAHUB_AUTH_TYPE: disabled
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M

  datahub-frontend:
    image: ${DATAHUB_FRONTEND_IMAGE}
    profiles: ["governance"]
    restart: unless-stopped
    networks: [platform]
    ports:
      - "${DATAHUB_FRONTEND_PORT}:9002"
    environment:
      DATAHUB_SECRET: ${DATAHUB_SECRET:?Set DATAHUB_SECRET in infra/.env}
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
    depends_on:
      datahub-gms:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9002/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # Run a recipe from ../data/datahub/recipes after GMS is ready. There is no
  # depends_on here, so invoking this runner does not start or check GMS.
  # Override command with: datahub ingest -c /opt/governance/recipes/<file>.yml
  datahub-ingest:
    image: ${DATAHUB_INGEST_IMAGE}
    build:
      context: .
      dockerfile: docker/datahub-ingest/Dockerfile
    profiles: ["governance"]
    networks: [platform]
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_GMS_TOKEN: ""
    volumes:
      - ../data/datahub:/opt/governance:ro
    command: ["datahub", "ingest", "-c", "/opt/governance/recipes/dp1_lineage.yml"]

volumes:
  opensearch-data:
