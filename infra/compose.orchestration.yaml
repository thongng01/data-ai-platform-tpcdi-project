# Configure Airflow metadata initialization, scheduling, and web access.
#
# Run from infra/ with `docker compose --profile airflow up -d`. Airflow keeps
# metadata in its own PostgreSQL database. Private connection and variable files
# are mounted read-only for setup; the image must supply the needed providers.

x-airflow: &airflow
  image: ${AIRFLOW_IMAGE}
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  networks: [platform]
  environment:
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # LocalExecutor starts task processes in the scheduler container. Eight is
    # a concurrency ceiling, not a reservation of eight CPU cores.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_AIRFLOW}
    # Keep this development web endpoint private because it exposes config.
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in infra/.env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__OPERATOR__DEFAULT_RETRY_NUMBER: "2"
    AIRFLOW__OPERATOR__DEFAULT_RETRY_DELAY: "60"
    # These values reach the Airflow process. Connection and variable files are
    # separate setup inputs; those files do not expand values from .env.
    PGHOST: postgres
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
  volumes: &airflow_volumes
    - ../data/airflow/dags:/opt/airflow/dags:ro
    - ../data/airflow/connections.yaml:/opt/airflow/connections.yaml:ro
    - ../data/airflow/variables.yaml:/opt/airflow/variables.yaml:ro
    - ../data/spark:/opt/pipelines:ro
    - ../data/dbt:/opt/dbt:ro
    - airflow-logs:/opt/airflow/logs
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:

  airflow-init:
    <<: *airflow
    profiles: ["airflow"]
    restart: "no"
    volumes: *airflow_volumes
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        # These fallbacks ignore all errors, not only an existing user. Check
        # initialization logs because failed imports can still exit successfully.
        airflow users create \
          --username "${AIRFLOW_USER}" --password "${AIRFLOW_PASSWORD}" \
          --firstname Coursework --lastname Admin \
          --role Admin --email admin@brokerage.local || true
        airflow connections import /opt/airflow/connections.yaml --conn-description "brokerage seed" || true
        airflow variables import /opt/airflow/variables.yaml || true
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-scheduler:
    <<: *airflow
    profiles: ["airflow"]
    volumes: *airflow_volumes
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-webserver:
    <<: *airflow
    profiles: ["airflow"]
    volumes: *airflow_volumes
    command: ["webserver", "--port", "8080"]
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  # A separate worker needs a compatible executor and worker command. With
  # LocalExecutor above, tasks run in airflow-scheduler, not this service.
  airflow-worker:
    <<: *airflow
    profiles: ["airflow"]
    volumes: *airflow_volumes
    command: ["worker", "--concurrency", "2"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  airflow-logs:
