# Configure Kafka topic initialization and the optional Flink cluster.
#
# Run from infra/ with `docker compose --profile stream up -d`. Kafka uses
# KRaft with one broker that also acts as controller, without ZooKeeper.
# Topic initialization below creates named topics; it does not rename stored data.

services:

  kafka:
    image: ${KAFKA_IMAGE}
    profiles: ["stream"]
    restart: unless-stopped
    networks: [platform]
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Containers use kafka:29092; host clients use localhost and KAFKA_PORT.
      # Kafka returns these addresses after the first connection, so a client
      # must receive an address it can reach to fetch messages.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single broker can hold only one replica. Replication factor 1 permits
      # creation but provides no copy on another broker if this broker fails.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Unlisted topic names can be created by clients with broker defaults.
      # A misspelled name can therefore create a separate one-partition topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1536M

  # Create topics that do not exist. Repeating this command leaves existing
  # partition counts and retention unchanged; it is not a configuration migration.
  kafka-init:
    image: ${KAFKA_IMAGE}
    profiles: ["stream"]
    networks: [platform]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      # Kafka source parallelism is bounded by the topic partition count.
      # Three partitions permit up to three active readers in one group.
      STREAM_TOPIC_PARTITIONS: 3
      STREAM_TOPIC_RETENTION_HOURS: 24
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        # Double dollar signs defer expansion from Compose to this shell.
        # Convert hours to milliseconds for Kafka retention.ms.
        for topic in tpcdi.trade tpcdi.cash_transaction; do
          kafka-topics --bootstrap-server "$${KAFKA_BOOTSTRAP}" \
            --create --if-not-exists --topic "$${topic}" \
            --partitions "$${STREAM_TOPIC_PARTITIONS}" \
            --replication-factor 1 \
            --config "retention.ms=$$(( $${STREAM_TOPIC_RETENTION_HOURS} * 3600 * 1000 ))"
          echo "topic ready: $${topic}"
        done
        kafka-topics --bootstrap-server "$${KAFKA_BOOTSTRAP}" --list

  jobmanager:
    image: ${FLINK_IMAGE}
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    profiles: ["stream"]
    restart: unless-stopped
    networks: [platform]
    command: jobmanager
    environment:
      # Process memory includes heap and non-heap allocations. Checkpoint mode
      # alone does not make sinks exactly-once or select durable checkpoint storage.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.bind-host: 0.0.0.0
        jobmanager.memory.process.size: 900m
        parallelism.default: 3
        state.backend.type: hashmap
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
      # Jobs must read these values to configure their S3 client. Passing an
      # environment value does not install or configure a Flink filesystem plugin.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    ports:
      - "${FLINK_UI_PORT}:8081"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 1280M

  taskmanager:
    image: ${FLINK_IMAGE}
    profiles: ["stream"]
    restart: unless-stopped
    networks: [platform]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.bind-host: 0.0.0.0
        taskmanager.memory.process.size: 1600m
        taskmanager.numberOfTaskSlots: 4
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    depends_on:
      - jobmanager
    deploy:
      resources:
        limits:
          memory: 2048M

  # One-shot. Submits a PyFlink job to the cluster running in jobmanager.
  #   docker compose --profile stream run --rm flink-submit <job.py> [args...]
  flink-submit:
    image: ${FLINK_IMAGE}
    profiles: ["stream"]
    networks: [platform]
    entrypoint: ["/opt/flink/bin/flink", "run", "--target", "jobmanager"]
    command: ["--help"]
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - ../data/flink:/opt/pipelines:ro
    depends_on:
      - jobmanager

volumes:
  kafka-data:
